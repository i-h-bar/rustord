# Cilium install values for the single-node k3s homelab cluster.
# Install with (see docs/cilium-install.md for the full procedure):
#   helm install cilium cilium/cilium --version 1.20.1 -n kube-system -f cilium/values.yaml
#
# k3s does not front the apiserver with a separate load balancer on a
# single-node install, so Cilium needs to be told the node's own address
# directly. Replace <NODE_IP> with this VM's IP address before installing.
k8sServiceHost: "<NODE_IP>"
k8sServicePort: "6443"

kubeProxyReplacement: true

operator:
  replicas: 1

hubble:
  enabled: true
  relay:
    enabled: true
