version: '3'

tasks:
  update-secrets: kubectl create secret generic app-secrets --from-env-file=.kube.env --dry-run=client -o yaml | kubectl apply -f -

  bulk-sync:
    cmds:
      - kubectl delete job bulk-sync-manual --ignore-not-found
      - kubectl create job bulk-sync-manual --from=cronjob/bulk-sync
      - kubectl wait pod -l job-name=bulk-sync-manual --for=condition=Ready --timeout=60s
      - kubectl logs -l job-name=bulk-sync-manual -f

  spoiler-sync:
    cmds:
      - kubectl delete job spoiler-sync-manual --ignore-not-found
      - kubectl create job spoiler-sync-manual --from=cronjob/spoiler-sync
      - kubectl wait pod -l job-name=spoiler-sync-manual --for=condition=Ready --timeout=60s
      - kubectl logs -l job-name=spoiler-sync-manual -f

  migrate:
    cmds:
      - kubectl delete job db-migrate --ignore-not-found
      - helm template rustcord charts/rustcord --show-only templates/db-management.yaml | kubectl apply -f -
      - kubectl wait pod -l job-name=db-migrate --for=condition=Ready --timeout=60s
      - kubectl logs -l job-name=db-migrate -f

  stop-k3s: sudo systemctl stop k3s
  start-k3s: sudo systemctl start k3s
  teardown: helm uninstall rustcord

  up:
    cmds:
      - task: start-k3s
      - task: update-secrets
      - helm upgrade --install rustcord charts/rustcord

  down:
    cmds:
      - task: teardown
      - task: stop-k3s